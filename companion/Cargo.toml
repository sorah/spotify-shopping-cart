[package]
name = "spotify-shopping-cart-companion"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "ssc_companion"
path = "src/lib.rs"

[[bin]]
name = "ssc-companion"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
base64 = "0.23.1"
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
globset = "0.4.20"
jiff = "0.2.37"
plist = "1.10.1"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = "2.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "fs", "time", "signal", "sync", "net"] }
tokio-rusqlite = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.25"
url = "2.5.8"
walkdir = "2.5.0"

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = { version = "0.5.3", features = ["util"] }
